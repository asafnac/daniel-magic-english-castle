name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # מאפשר להריץ פרסום ידני מלשונית Actions
  workflow_dispatch:

# ההרשאות הנדרשות לפרסום. אין כאן שום סוד ושום מפתח.
permissions:
  contents: read
  pages: write
  id-token: write

# פרסום אחד בכל רגע. הרצה חדשה לא מבטלת הרצה שכבר באוויר.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
