name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # מאפשר להריץ פרסום ידני מלשונית Actions
  workflow_dispatch:

# ההרשאות הנדרשות לפרסום. אין כאן שום סוד ושום מפתח.
permissions:
  contents: read
  pages: write
  id-token: write

# פרסום אחד בכל רגע. הרצה חדשה לא מבטלת הרצה שכבר באוויר.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # בדיקת הטיפוסים כוללת גם את שרת הסנכרון, שלא נכלל בבנייה עצמה
      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # הבדיקה העצמית רצה כאן ולא רק בזרימת הבדיקות הנפרדת, כדי
      # שמשימה שבורה לא תוכל להגיע לפרודקשן בזמן שהבדיקות עוד רצות
      # במקביל. עלות: כשתי דקות. תמורה: הדף שדניאל פותחת תמיד עובד.
      - name: Install a browser for the self test
        run: npx playwright install --with-deps chromium

      - name: Self test
        run: npm test

      - name: Check the built site
        run: npm run check:build

      - name: Device test
        run: node scripts/run-devicetest.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
