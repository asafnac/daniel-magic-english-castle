# בדיקות. רצות בכל דחיפה ובכל בקשת משיכה, לפני ובנוסף לפרסום.
#
# הבדיקה העצמית זקוקה לדפדפן אמיתי: היא לוחצת על כפתורים וקוראת DOM.
# עד שהקובץ הזה נוסף, 1327 הבדיקות רצו רק כשמישהו זכר לפתוח את הדף,
# כלומר משימה שבורה יכלה להגיע לפרודקשן על ירוק.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# אין כאן שום סוד ושום מפתח.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check, game and server
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Build the sync server
        run: npm run build:server

      # ראו את ההערה באותו שלב ב-deploy.yml: --with-deps מריץ apt-get,
      # וזה מה שתקע פרסומים לחצי שעה. הספריות כבר קיימות בראנר.
      - name: Cache the test browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install a browser for the self test
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Self test
        run: npm test

      # בודק שמה שנבנה יעבוד גם בלי רשת: רשימת המעטפת מכסה את כל
      # מה שנכתב, ה-manifest מבטיח אייקונים שקיימים, ולא נשאר סמן
      # שלא הוחלף. כשלון כאן לא רואים בשום בדיקה אחרת.
      - name: Check the built site
        run: npm run check:build

      # בדיקת המכשיר: שני "מכשירים" מול שרת שמחקה את הוורקר, מצב
      # לא-מקוון וכפתור ההתקנה. זו הבדיקה שמכסה את התרחיש שמוחק
      # התקדמות, ולכן היא רצה על כל דחיפה.
      - name: Device test
        run: node scripts/run-devicetest.mjs
