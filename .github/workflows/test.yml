# בדיקות. רצות בכל דחיפה ובכל בקשת משיכה, לפני ובנוסף לפרסום.
#
# הבדיקה העצמית זקוקה לדפדפן אמיתי: היא לוחצת על כפתורים וקוראת DOM.
# עד שהקובץ הזה נוסף, 1327 הבדיקות רצו רק כשמישהו זכר לפתוח את הדף,
# כלומר משימה שבורה יכלה להגיע לפרודקשן על ירוק.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# אין כאן שום סוד ושום מפתח.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check, game and server
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Build the sync server
        run: npm run build:server

      - name: Install a browser for the self test
        run: npx playwright install --with-deps chromium

      - name: Self test
        run: npm test
